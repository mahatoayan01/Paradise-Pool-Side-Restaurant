<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#poolGrad)"/>
  <!-- Water wave ripples -->
  <path d="M0 240 Q150 200 300 240 T600 240 L600 400 L0 400 Z" fill="#042f2e" opacity="0.4"/>
  <path d="M0 290 Q150 260 300 290 T600 290 L600 400 L0 400 Z" fill="#0d9488" opacity="0.3"/>
  <!-- Pool Deck line -->
  <rect x="0" y="340" width="600" height="60" fill="#292524" opacity="0.85"/>
  <!-- Pool reflection sparkle -->
  <circle cx="480" cy="180" r="100" fill="url(#glowGrad)" filter="blur(30px)" opacity="0.6"/>
  <!-- Center content -->
  <circle cx="300" cy="170" r="70" fill="#ffffff" fill-opacity="0.1" stroke="#5eead4" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="300" y="165" font-family="sans-serif" font-size="44" text-anchor="middle" fill="#fef08a">🍢</text>
  <text x="300" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" text-anchor="middle" fill="#ffffff" letter-spacing="1">SIGNATURE PLATTER</text>
  <text x="300" y="228" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#ccfbf1">Tandoori Kebabs &amp; Poolside Specialties</text>
  <!-- Replace note badge -->
  <rect x="180" y="358" width="240" height="24" rx="12" fill="#0f766e" fill-opacity="0.8"/>
  <text x="300" y="374" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#99f6e4">Replace with photo in /public/images</text>
</svg>

