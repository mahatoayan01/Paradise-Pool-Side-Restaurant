<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="duskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#431407" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#duskGrad)"/>
  <!-- Lanterns -->
  <circle cx="200" cy="220" r="18" fill="#fbbf24" filter="blur(6px)"/>
  <circle cx="400" cy="200" r="22" fill="#f59e0b" filter="blur(6px)"/>
  <circle cx="600" cy="220" r="18" fill="#fbbf24" filter="blur(6px)"/>
  <!-- Water Reflection -->
  <rect x="0" y="380" width="800" height="220" fill="#042f2e" opacity="0.8"/>
  <ellipse cx="400" cy="460" rx="200" ry="25" fill="#f59e0b" opacity="0.25" filter="blur(10px)"/>
  <text x="400" y="140" font-family="'Playfair Display', serif" font-size="32" font-weight="700" text-anchor="middle" fill="#fef3c7">Twilight Ambiance</text>
  <text x="400" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" text-anchor="middle" fill="#fed7aa">Peaceful Resort Evening By the Water</text>
  <rect x="250" y="530" width="300" height="34" rx="17" fill="#0f172a" stroke="#d97706"/>
  <text x="400" y="552" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#fde68a">Replace with real camera photo in /public/images</text>
</svg>

