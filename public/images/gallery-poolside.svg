<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="poolDeckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#042f2e"/>
  <!-- Pool water -->
  <rect x="0" y="240" width="800" height="360" fill="url(#poolDeckGrad)"/>
  <!-- Ripple rings -->
  <ellipse cx="400" cy="400" rx="280" ry="60" fill="none" stroke="#99f6e4" stroke-width="2" opacity="0.4"/>
  <ellipse cx="400" cy="400" rx="180" ry="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <!-- Deck tables silhouette -->
  <rect x="60" y="160" width="160" height="120" rx="8" fill="#1c1917" opacity="0.75"/>
  <rect x="580" y="160" width="160" height="120" rx="8" fill="#1c1917" opacity="0.75"/>
  <circle cx="140" cy="200" r="16" fill="#f59e0b" opacity="0.8" filter="blur(4px)"/>
  <circle cx="660" cy="200" r="16" fill="#f59e0b" opacity="0.8" filter="blur(4px)"/>
  <text x="400" y="120" font-family="'Playfair Display', serif" font-size="34" font-weight="700" text-anchor="middle" fill="#ffffff">Open-Air Poolside Deck</text>
  <text x="400" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" text-anchor="middle" fill="#99f6e4">Tables Along the Water at Shakthi Hill Resorts</text>
  <rect x="250" y="530" width="300" height="34" rx="17" fill="#042f2e" fill-opacity="0.8" stroke="#14b8a6"/>
  <text x="400" y="552" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#99f6e4">Replace with real camera photo in /public/images</text>
</svg>

